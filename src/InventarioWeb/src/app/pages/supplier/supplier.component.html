<div class="container mt-4">
    <h2>Supplier Management</h2>
    
    <!-- Create Supplier Form -->
    <form class="mb-4">
        <h4>Create Supplier</h4>
        <div class="mb-3">
            <label for="supplierName" class="form-label">Supplier Name</label>
            <input type="text" id="supplierName" class="form-control" name="supplierName" required>
        </div>
        
        <div class="mb-3">
            <label for="supplierAddress" class="form-label">Address</label>
            <input type="text" id="supplierAddress" class="form-control" name="supplierAddress" required>
        </div>
        
        <div class="mb-3">
            <label for="supplierPhone" class="form-label">Phone</label>
            <input type="text" id="supplierPhone" class="form-control" name="supplierPhone" required>
        </div>
        
        <div class="mb-3">
            <label for="supplierEmail" class="form-label">Email</label>
            <input type="email" id="supplierEmail" class="form-control" name="supplierEmail" required>
        </div>
        
        <div class="mb-3">
            <label for="supplierCountry" class="form-label">Country</label>
            <input type="text" id="supplierCountry" class="form-control" name="supplierCountry" required>
        </div>
        
        <div class="mb-3">
            <label for="supplierStatus" class="form-label">Status</label>
            <select id="supplierStatus" class="form-select" name="supplierStatus" required>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Create</button>
    </form>
    
    <!-- Supplier List -->
    <h4>Supplier List</h4>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Country</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Example Supplier</td>
                <td>123 Street</td>
                <td>123456789</td>
                <td>supplier</td>
                <td>USA</td>
                <td>Active</td>
                <td>
                    <button class="btn btn-warning btn-sm">Edit</button>
                    <button class="btn btn-danger btn-sm">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
